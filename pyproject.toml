[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbit-shell"
version = "1.0.0"
description = "GBit Shell — a modern, fast developer terminal with built-in GitHub publishing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Gislaine"},
]
keywords = [
    "shell", "terminal", "repl", "cli", "prompt", "git", "github",
    "developer-tools", "devtools", "vscode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Terminals",
]
dependencies = [
    "prompt_toolkit>=3.0.36",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
gbit = "gbit_shell.__main__:main"
gbit-shell = "gbit_shell.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gbit_shell*"]

[tool.setuptools.package-data]
gbit_shell = ["_vscode_ext/*.js", "py.typed"]

[project.urls]
Homepage = "https://github.com/Gislaine-programadora/gbit-shell"
Issues = "https://github.com/Gislaine-programadora/gbit-shell/issues"
